name: Cloud release
on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      bootstrap_only:
        description: Publish the first image before the Azure web resource exists
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloud-release
  cancel-in-progress: false
jobs:
  checks:
    if: >-
      github.ref == 'refs/heads/deploy' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.bootstrap_only)
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: image
        name: Pin image to the checked-out commit
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver: docker-container
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          provenance: true
          sbom: true
  deploy:
    needs: publish
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bootstrap_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEB_APP }}
        run: |
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --image "$IMAGE" --output none
      - name: Verify public health and production login
        env:
          APP_URL: ${{ vars.WEB_URL }}
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 "$APP_URL/api/health"
          curl --fail --retry 3 "$APP_URL/login" > /tmp/login.html
          ! grep -q 'admin@dev.local\|Accesos de demostración' /tmp/login.html
